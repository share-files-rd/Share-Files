name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build project
        run: npm run build
      - name: Add CNAME for custom domain
        run: |
          if [ -d dist ]; then
            echo "share-files-rd.duckdns.org" > dist/CNAME
          else
            echo "dist directory not found; creating simple static site"
            mkdir -p dist
            cat > dist/index.html <<'HTML'
            <!doctype html>
            <meta charset="utf-8">
            <title>Share Files</title>
            <h1>Site Live</h1>
            <p>share-files-rd.duckdns.org</p>
          HTML
            echo "share-files-rd.duckdns.org" > dist/CNAME
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
